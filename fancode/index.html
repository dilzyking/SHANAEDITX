<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHANAEDITX - LIVE</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Tailwind -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
body{
background:#0a0f1c;
font-family:'Poppins',sans-serif;
color:#edf2f7;
}

button{
font-family:'Poppins',sans-serif;
}

.match-tile{
background:#131d2f;
border-radius:32px;
border:1px solid #253247;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 15px 30px -10px rgba(0,0,0,0.8);
transition:.25s;
}

.match-tile:hover{
background:#17253b;
border-color:#3b82f6;
transform:scale(1.02) translateY(-4px);
box-shadow:0 25px 40px -8px #1e3a8a40;
}

.img-wrapper{
overflow:hidden;
height:210px;
position:relative;
}

.match-img{
width:100%;
height:100%;
object-fit:cover;
}

.live-badge{
background:#b91c1c;
color:white;
font-size:12px;
padding:4px 10px;
border-radius:20px;
position:absolute;
top:12px;
left:12px;
animation:liveBlink 1s infinite;
}

@keyframes liveBlink{
0%{opacity:1;}
50%{opacity:0.3;}
100%{opacity:1;}
}

.scheduled-badge{
background:rgba(0,0,0,.6);
color:white;
font-size:12px;
padding:4px 10px;
border-radius:20px;
position:absolute;
top:12px;
left:12px;
}

.watch-btn{
background:#2563eb;
border-radius:50px;
padding:12px;
font-weight:600;
display:flex;
align-items:center;
justify-content:center;
gap:6px;
margin-top:12px;
cursor:pointer;
}

.watch-btn:hover{
background:#1d4ed8;
}

.share-upcoming-btn{
background:#334155;
border-radius:50px;
padding:10px;
font-weight:600;
font-size:13px;
display:flex;
align-items:center;
justify-content:center;
gap:6px;
margin-top:8px;
cursor:pointer;
color:#cbd5e1;
transition:.2s;
}

.share-upcoming-btn:hover{
background:#475569;
color:#fff;
}

#qualityModal{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
backdrop-filter:blur(6px);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

#qualityModal.hidden{
display:none;
}

#qualityModal .modal-content{
width:90%;
max-width:360px;
background:#111827;
border-radius:18px;
padding:22px;
text-align:center;
box-shadow:0 20px 40px rgba(0,0,0,.7);
}

#qualityModal h2{
font-size:20px;
font-weight:600;
margin-bottom:18px;
color:#f9fafb;
}

#qualityList{
display:flex;
flex-direction:column;
gap:10px;
}

.quality-item{
background:#1f2937;
border-radius:12px;
padding:14px 16px;
font-size:16px;
font-weight:500;
color:#e5e7eb;
display:flex;
align-items:center;
justify-content:space-between;
cursor:pointer;
transition:.2s;
}

.quality-item::after{
content:">";
font-size:12px;
opacity:.7;
}

.quality-item:hover{
background:#2563eb;
color:white;
transform:translateY(-1px);
}

#qualityModal .btn{
margin-top:16px;
background:#ef4444;
color:white;
border:none;
border-radius:10px;
padding:10px;
font-size:14px;
font-weight:600;
cursor:pointer;
}

#qualityModal .btn:hover{
background:#dc2626;
}

#telegramModal {
  position: fixed;
  inset: 0;
  background: rgba(5, 8, 20, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  opacity: 0;
  visibility: hidden;
  transition: opacity 1s ease, visibility 1s ease;
}

#telegramModal.active {
  opacity: 1;
  visibility: visible;
}

#telegramModal .modal-content {
  width: 90%;
  max-width: 380px;
  background: linear-gradient(145deg, #131d2f, #0d1522);
  border: 1px solid rgba(59, 130, 246, 0.3);
  border-radius: 28px;
  padding: 30px 24px;
  text-align: center;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(37, 99, 235, 0.15);
  transform: translateY(20px) scale(0.95);
  transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
}

#telegramModal.active .modal-content {
  transform: translateY(0) scale(1);
}

#toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #10b981;
  color: white;
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 500;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  z-index: 3000;
  transition: transform 0.3s ease, opacity 0.3s ease;
  opacity: 0;
}

#toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

*{
-webkit-user-select:none;
-moz-user-select:none;
-ms-user-select:none;
user-select:none;
-webkit-tap-highlight-color: transparent;
}

.match-time{
font-size:13px;
color:#9ca3af;
margin-top:6px;
}
</style>
</head>

<body class="p-5 max-w-7xl mx-auto">

<div class="text-center mt-4 mb-8">
  <div class="inline-flex items-center justify-center gap-3 bg-[#131d2f] py-3 px-7 rounded-full border border-blue-900/50">
    <span class="text-3xl font-black tracking-tight text-white">SHANAEDITX</span>
  </div>
  <p class="text-gray-500 text-sm mt-3 tracking-wide">LIVE STREAMING</p>
</div>

<div id="matches-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 mt-6"></div>

<div id="toast">Match link copied to clipboard!</div>

<div id="qualityModal" class="hidden">
  <div class="modal-content">
    <h2>Select Quality</h2>
    <div id="qualityList"></div>
    <button onclick="closeQuality()" class="btn">Close</button>
  </div>
</div>

<div id="telegramModal">
  <div class="modal-content">
    <div class="relative w-16 h-16 bg-gradient-to-tr from-blue-600 to-blue-400 text-white rounded-2xl flex items-center justify-center mx-auto mb-5 text-3xl shadow-lg shadow-blue-500/30">
      <i class="fab fa-telegram-plane"></i>
    </div>
    <h2 class="text-2xl font-bold text-white mb-2">Join Our Telegram</h2>
    <p class="text-gray-400 text-sm mb-7 leading-relaxed">Join our official Telegram channel for instant match links and updates!</p>
    <a href="https://t.me/+U_REj979FENlMTM9" target="_blank" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2.5 mb-4 shadow-xl shadow-blue-600/30 text-base no-underline">
      <i class="fab fa-telegram text-xl"></i> JOIN NOW
    </a>
    <button onclick="closeTelegramModal()" class="w-full text-gray-400 hover:text-white text-xs font-semibold py-2 tracking-wider uppercase transition bg-transparent border-none cursor-pointer">
      I've joined
    </button>
  </div>
</div>

<script>
const DATA_URL = 'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/refs/heads/main/fancode.json';
const PLAYER_URL = 'fc-play.html';
const container = document.getElementById("matches-container");

let allMatches = [];

document.addEventListener("DOMContentLoaded", () => {
  if (!localStorage.getItem('telegramJoined')) {
    setTimeout(() => {
      document.getElementById('telegramModal').classList.add('active');
    }, 200);
  }
});

function closeTelegramModal() {
  localStorage.setItem('telegramJoined', 'true');
  const modal = document.getElementById('telegramModal');
  modal.classList.remove('active');
  setTimeout(() => {
    modal.style.display = 'none';
  }, 1000);
}

fetch(DATA_URL)
  .then(res => res.json())
  .then(data => {
    allMatches = data.matches || [];
    container.innerHTML = "";

    const matches = allMatches.sort((a, b) => {
      const aLive = (a.status || "").toUpperCase() === "LIVE";
      const bLive = (b.status || "").toUpperCase() === "LIVE";
      return bLive - aLive;
    });

    matches.forEach((m, index) => {
      const isLive = (m.status || "").toUpperCase() === "LIVE";
      const img = m.image || "https://www.fancode.com/skillup-uploads/cms-media/Cricket_Fallback_Old_match-card.jpg";
      const exactTime = m.startTime || "Soon";
      const card = document.createElement("div");
      card.className = "match-tile";
      
      let actionButtons = "";
      if (isLive) {
        actionButtons = `<div onclick="openQuality(${index})" class="watch-btn"><i class="fas fa-play"></i> WATCH NOW</div>`;
      } else {
        actionButtons = `
          <div class="watch-btn not-live"><i class="far fa-clock"></i> NOT LIVE</div>
          <div onclick="shareUpcoming(${index})" class="share-upcoming-btn"><i class="fas fa-share-alt"></i> Share Match</div>
        `;
      }

      card.innerHTML = `
        <div class="img-wrapper">
          <img src="${img}" class="match-img">
          ${isLive
            ? '<span class="live-badge"><i class="fas fa-circle"></i> LIVE</span>'
            : '<span class="scheduled-badge"><i class="far fa-calendar"></i> SCHEDULED</span>'}
        </div>
        <div class="p-5 flex flex-col flex-1">
          <h3 class="text-xl font-bold">${m.title || 'Match'}</h3>
          <div class="text-sm text-gray-400 mt-2">${m.tournament || ''}</div>
          <div class="match-time"><i class="far fa-clock text-blue-400 mr-1"></i> ${exactTime}</div>
          <div class="mt-auto pt-3">${actionButtons}</div>
        </div>
      `;
      container.appendChild(card);
    });
  })
  .catch(() => {
    container.innerHTML = "<p class='text-center col-span-full'>Failed to load matches</p>";
  });

function shareUpcoming(index) {
  const match = allMatches[index];
  const matchTitle = match.title || "Upcoming Match";
  const exactTime = match.startTime || "Coming Soon";
  
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const diff = now - start;
  const oneDay = 1000 * 60 * 60 * 24;
  const dayOfYear = Math.floor(diff / oneDay);
  const uniqueId = 10 + (dayOfYear % 90);

  const encodedTitle = btoa(encodeURIComponent(matchTitle));
  const encodedTime = btoa(encodeURIComponent(exactTime));
  const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '');
  const targetUrl = `${baseUrl}${PLAYER_URL}?t=${encodedTitle}&time=${encodedTime}`;
  const textToShare = `Fancode (English)\n${matchTitle}\n${targetUrl}#${uniqueId}`;

  if (navigator.share) {
    navigator.share({
      title: 'SHANAEDITX LIVE',
      text: textToShare,
    }).catch(() => {});
  } else {
    navigator.clipboard.writeText(textToShare).then(() => {
      showToast();
    });
  }
}

function showToast() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 2500);
}

function openQuality(index) {
  const match = allMatches[index];
  const streams = match.auto_streams && match.auto_streams.ENGLISH && match.auto_streams.ENGLISH.streams;
  if (!streams || Object.keys(streams).length === 0) {
    alert("Stream not available");
    return;
  }

  const list = document.getElementById("qualityList");
  list.innerHTML = "";

  const order = ['1080p','720p','540p','480p','360p','240p'];
  const sortedKeys = Object.keys(streams).sort((a, b) => order.indexOf(b) - order.indexOf(a));

  sortedKeys.forEach(q => {
    const btn = document.createElement("div");
    btn.className = "quality-item";
    btn.innerText = q;
    btn.onclick = function () {
      const encodedStream = btoa(streams[q]);
      const encodedTitle = btoa(encodeURIComponent(match.title || "Match"));
      const exactTime = match.startTime || "Soon";
      const encodedTime = btoa(encodeURIComponent(exactTime));
      window.location.href = `${PLAYER_URL}?data=${encodeURIComponent(encodedStream)}&t=${encodedTitle}&time=${encodedTime}`;
    };
    list.appendChild(btn);
  });

  document.getElementById("qualityModal").classList.remove("hidden");
}

function closeQuality() {
  document.getElementById("qualityModal").classList.add("hidden");
}
</script>

</body>
</html>
